<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Confidence Survey</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root {
    --accent: #00b2a9;
    --accent-2: #2bace2;
    --ink: #1f2a37;
    --ink-soft: #6b7684;
    --line: #e6eaef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #ffffff;
    color: var(--ink);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .logo {
    margin: 48px 0 0;
  }
  .logo img { width: 170px; height: auto; display: block; }
  main {
    flex: 1;
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  .question {
    font-size: 1.45rem;
    font-weight: 600;
    line-height: 1.45;
    text-align: center;
    min-height: 4.4em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scale { margin: 40px 0 8px; }
  .scale-value {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 14px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) 50%, var(--line) 50%, var(--line) 100%);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    cursor: pointer;
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .nav {
    display: flex;
    justify-content: space-between;
    margin-top: 48px;
    gap: 12px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 34px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: all .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); color: #fff; }
  button:disabled { opacity: 0; pointer-events: none; }
  .done { text-align: center; display: none; }
  .done h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 12px; }
  .done p { color: var(--ink-soft); margin-bottom: 28px; line-height: 1.5; }
  .done-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .error-note { color: #c0392b; font-size: .85rem; margin-top: 16px; display: none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>
  <div class="logo"><img src="logo.png" alt="Axialink Global Services"></div>

  <main>
    <div id="survey">
      <div class="question" id="questionText"></div>
      <div class="scale">
        <div class="scale-value" id="scaleValue">50</div>
        <input type="range" id="slider" min="0" max="100" step="1" value="50" aria-label="Agreement scale">
        <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
      </div>
      <div class="nav">
        <button id="backBtn">Back</button>
        <button id="nextBtn" class="primary">Next</button>
      </div>
    </div>

    <div class="done" id="done">
      <h2>Thank you</h2>
      <p>Your responses have been recorded anonymously.<br>Download your personal confidence score below — it is for your own private use.</p>
      <div class="done-actions">
        <button class="primary" id="downloadBtn">Download my results (PDF)</button>
      </div>
      <div class="error-note" id="errorNote"></div>
    </div>
  </main>

<script>
const SUPABASE_URL = "https://hjkrhmrdaqtgsqaoijxv.supabase.co";
const SUPABASE_KEY = "sb_publishable_6pD0XiYt69rnIXQIA_CVCQ_58vug8Ir";

const QUESTIONS = [
  "I feel confident using AI tools (e.g., Copilot, ChatGPT) in my day-to-day work.",
  "I know when AI can help me complete a task more efficiently.",
  "I know how to write effective prompts to get useful results from AI tools.",
  "I trust the information provided by AI when completing work tasks.",
  "I understand the limitations and risks of using AI-generated content.",
  "I can confidently assess whether AI-generated information is accurate and appropriate before using it.",
  "I know where to go for guidance, training, or support on using AI at work.",
  "AI helps me improve the quality of my work.",
  "I believe AI will have a positive impact on my role and career opportunities.",
  "I am concerned that AI could reduce the need for skills or roles like mine in the future."
];

const CATEGORIES = [
  { name: "Capability",         indices: [0, 1, 2] },
  { name: "Trust & Governance", indices: [3, 4, 5] },
  { name: "Support & Adoption", indices: [6, 7] },
  { name: "Future Outlook",     indices: [8, 9] }
];

// Question 10 is reverse scored.
const REVERSED = new Set([9]);

const answers = new Array(QUESTIONS.length).fill(50);
let current = 0;

const questionText = document.getElementById("questionText");
const slider = document.getElementById("slider");
const scaleValue = document.getElementById("scaleValue");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");
const surveyEl = document.getElementById("survey");
const doneEl = document.getElementById("done");
const errorNote = document.getElementById("errorNote");

function paintSlider() {
  const v = slider.value;
  slider.style.background =
    `linear-gradient(to right, var(--accent) 0%, var(--accent) ${v}%, var(--line) ${v}%, var(--line) 100%)`;
  scaleValue.textContent = v;
}

function render() {
  questionText.textContent = QUESTIONS[current];
  slider.value = answers[current];
  paintSlider();
  backBtn.disabled = current === 0;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? "Submit" : "Next";
}

slider.addEventListener("input", () => {
  answers[current] = Number(slider.value);
  paintSlider();
});

backBtn.addEventListener("click", () => {
  if (current > 0) { current--; render(); }
});

nextBtn.addEventListener("click", async () => {
  answers[current] = Number(slider.value);
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
    return;
  }
  nextBtn.textContent = "Submitting…";
  nextBtn.style.pointerEvents = "none";
  await submit();
});

function scored(i) {
  return REVERSED.has(i) ? 100 - answers[i] : answers[i];
}

function categoryScores() {
  const scores = {};
  CATEGORIES.forEach(c => {
    const total = c.indices.reduce((sum, i) => sum + scored(i), 0);
    scores[c.name] = Math.round((total / c.indices.length) * 10) / 10;
  });
  const overall = Math.round(
    (QUESTIONS.reduce((sum, _, i) => sum + scored(i), 0) / QUESTIONS.length) * 10
  ) / 10;
  return { scores, overall };
}

async function submit() {
  const { scores, overall } = categoryScores();
  const row = {
    q1: answers[0], q2: answers[1], q3: answers[2], q4: answers[3], q5: answers[4],
    q6: answers[5], q7: answers[6], q8: answers[7], q9: answers[8], q10: answers[9],
    capability_score: scores["Capability"],
    trust_governance_score: scores["Trust & Governance"],
    support_adoption_score: scores["Support & Adoption"],
    future_outlook_score: scores["Future Outlook"],
    overall_score: overall
  };

  let saved = false;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/survey_responses`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(row)
    });
    saved = res.ok;
  } catch (e) {
    saved = false;
  }

  surveyEl.style.display = "none";
  doneEl.style.display = "block";
  if (!saved) {
    errorNote.textContent = "Note: your response could not be sent to the server, but you can still download your personal results.";
    errorNote.style.display = "block";
  }
}

function band(score) {
  if (score >= 75) return "High confidence";
  if (score >= 50) return "Moderate confidence";
  if (score >= 25) return "Developing confidence";
  return "Low confidence";
}

// Draws one speedometer dial (track, filled arc, needle) on a canvas and
// returns it as a PNG data URL. Rendered at 2x for crispness in the PDF.
function gaugeImage(value) {
  const w = 400, h = 240;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const cx = 200, cy = 200, r = 150;
  const pct = Math.max(0, Math.min(100, value)) / 100;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.lineCap = "round";
  ctx.lineWidth = 26;

  // Track
  ctx.strokeStyle = "#e0f4f3";
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI, 2 * Math.PI);
  ctx.stroke();

  // Filled arc
  if (pct > 0) {
    const grad = ctx.createLinearGradient(cx - r, 0, cx + r, 0);
    grad.addColorStop(0, "#00b2a9");
    grad.addColorStop(1, "#2bace2");
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, Math.PI * (1 + pct));
    ctx.stroke();
  }

  // Needle
  const angle = Math.PI * (1 + pct);
  ctx.strokeStyle = "#1f2a37";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(angle) * (r - 30), cy + Math.sin(angle) * (r - 30));
  ctx.stroke();
  ctx.fillStyle = "#1f2a37";
  ctx.beginPath();
  ctx.arc(cx, cy, 11, 0, 2 * Math.PI);
  ctx.fill();

  return canvas.toDataURL("image/jpeg", 0.92);
}

function loadLogoDataUrl() {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      canvas.getContext("2d").drawImage(img, 0, 0);
      try { resolve({ url: canvas.toDataURL("image/png"), w: img.naturalWidth, h: img.naturalHeight }); }
      catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = "logo.png";
  });
}

async function downloadPdf() {
  const { scores, overall } = categoryScores();
  const date = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  const doc = new jspdf.jsPDF({ unit: "mm", format: "a4" });
  const pageW = 210;
  const ink = [31, 42, 55], soft = [107, 118, 132], teal = [0, 178, 169];

  // Logo
  const logo = await loadLogoDataUrl();
  if (logo) {
    const lw = 42, lh = lw * (logo.h / logo.w);
    doc.addImage(logo.url, "PNG", (pageW - lw) / 2, 14, lw, lh);
  }

  // Title
  doc.setTextColor(...ink);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.text("Your AI Confidence Score", pageW / 2, 40, { align: "center" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(...soft);
  doc.text(`Completed on ${date} · For your own private use`, pageW / 2, 47, { align: "center" });

  // Overall gauge (large, centered). Gauge images are 400x240 px.
  const ratio = 240 / 400;
  const ow = 76, oh = ow * ratio;
  doc.addImage(gaugeImage(overall), "JPEG", (pageW - ow) / 2, 54, ow, oh);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(24);
  doc.setTextColor(...teal);
  doc.text(String(overall), pageW / 2, 54 + oh + 10, { align: "center" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  doc.setTextColor(...soft);
  doc.text(`Overall confidence (out of 100) — ${band(overall)}`, pageW / 2, 54 + oh + 17, { align: "center" });

  // Category gauges in a 2x2 grid
  const gw = 58, gh = gw * ratio;
  const colX = [pageW / 2 - gw - 9, pageW / 2 + 9];
  const rowY = [130, 185];
  CATEGORIES.forEach((c, i) => {
    const x = colX[i % 2], y = rowY[Math.floor(i / 2)];
    doc.addImage(gaugeImage(scores[c.name]), "JPEG", x, y, gw, gh);
    const cxm = x + gw / 2;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.setTextColor(...ink);
    doc.text(String(scores[c.name]), cxm, y + gh + 8, { align: "center" });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(c.name, cxm, y + gh + 14, { align: "center" });
    doc.setFontSize(8.5);
    doc.setTextColor(...soft);
    doc.text(band(scores[c.name]), cxm, y + gh + 19, { align: "center" });
  });

  // Footer note
  doc.setDrawColor(230, 234, 239);
  doc.line(20, 270, pageW - 20, 270);
  doc.setFontSize(8.5);
  doc.setTextColor(...soft);
  const note = "Scores are the average of your answers in each area on a 0–100 scale. The question about AI reducing the need for your skills is reverse scored, so higher scores always mean greater confidence.";
  doc.text(doc.splitTextToSize(note, pageW - 40), 20, 276);

  doc.save("ai-confidence-score.pdf");
}

document.getElementById("downloadBtn").addEventListener("click", () => {
  if (window.jspdf && window.jspdf.jsPDF) {
    downloadPdf();
    return;
  }
  // jsPDF failed to load (e.g. offline): fall back to a plain-text summary.
  const { scores, overall } = categoryScores();
  const text = ["Your AI Confidence Score", "",
    `Overall: ${overall} / 100 (${band(overall)})`, "",
    ...CATEGORIES.map(c => `${c.name}: ${scores[c.name]} / 100 (${band(scores[c.name])})`)
  ].join("\n");
  const url = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "ai-confidence-score.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

render();

</script>
</body>
</html>
